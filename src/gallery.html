<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Mines of Jupiter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><b>Mines of Jupiter</b></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#booking">Booking</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#testimonials">Testimonials</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header class="hero d-flex align-items-center text-center" style="background-color: #f8f9fa;">
    <div class="container py-5">
      <h1>Gallery</h1>
      <p class="lead">Explore moments and views from Mines of Jupiter</p>
    </div>
  </header>

  <!-- Gallery Carousel -->
  <section class="py-5 bg-light">
    <div class="container text-center">
      <div id="galleryCarousel" class="carousel slide shadow-lg rounded" data-bs-ride="carousel">
        <div class="carousel-inner rounded">

          <!-- Slide 1 -->
          <div class="carousel-item active">
            <img src="./images/1.jpg" class="d-block w-100 rounded" alt="Gallery Image 1">
          </div>

          <!-- Slide 2 -->
          <div class="carousel-item">
            <img src="./images/2.jpg" class="d-block w-100 rounded" alt="Gallery Image 2">
          </div>

          <!-- Slide 3 -->
          <div class="carousel-item">
            <img src="./images/3.jpg" class="d-block w-100 rounded" alt="Gallery Image 3">
          </div>

          <!-- Slide 4 -->
          <div class="carousel-item">
            <img src="./images/4.jpg" class="d-block w-100 rounded" alt="Gallery Image 4">
          </div>

          <!-- Slide 5 -->
          <div class="carousel-item">
            <img src="./images/5.jpg" class="d-block w-100 rounded" alt="Gallery Image 5">
          </div>

        </div>

        <!-- Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#galleryCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#galleryCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>

        <!-- Indicators -->
        <div class="carousel-indicators mt-3">
          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="4" aria-label="Slide 5"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2025 Mines of Jupiter</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
